<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#2E5D3A"
    />

    <meta
      name="description"
      content="Explore ITS — Trilha da Semente Peregrina"
    />

    <title>
      Explore ITS — Trilha da Semente Peregrina
    </title>

    <!-- Identidade tipográfica -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Montserrat:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- PWA -->
    <link
      rel="manifest"
      href="/manifest.json"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/icon-192.png"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Explore ITS"
    />
  </head>

  <body>
    <div id="app"></div>

    <script
      type="module"
      src="/src/main.ts"
    ></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then(registration => {
              console.log(
                'Service Worker registrado:',
                registration.scope
              );
            })
            .catch(error => {
              console.log(
                'Falha ao registrar Service Worker:',
                error
              );
            });
        });
      }
    </script>
  </body>
</html>
